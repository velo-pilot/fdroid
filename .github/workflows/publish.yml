# Builds the VeloPilot dev and beta F-Droid repositories from the GitHub pre-releases of velo-pilot/android and
# publishes them on https://cdn.velopilot.be/fdroid-dev/repo (dev builds of main, vX.Y.Z-dev.RUN) and
# https://cdn.velopilot.be/fdroid-beta/repo (betas, vX.Y.Z-beta.N).
#
# Only these two are published from here. The release repository is signed with a key that stays in Bitwarden and
# is published from a local checkout with ./release.sh, so GitHub never holds anything that can change it.
#
# The jobs run in the "dev" environment. Its variables (BUNNY_STORAGE_ZONE, BUNNY_STORAGE_HOST) and secrets
# (BUNNY_STORAGE_PASSWORD, ANDROID_RELEASES_TOKEN, FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASSWORD) are managed by
# OpenTofu in infra/github.tf. They give access to the CI storage zone and the CI key only, which serve and sign both
# repositories. There's no cache purge: the CDN keeps them for a minute (infra/bunny.tf).
#
# The workflows of velo-pilot/android start this with a repository_dispatch event of type android-release; the
# schedule catches builds made without it. Scheduled and dispatched runs stop early when the pre-releases and this
# repository haven't changed since the last publish (inputs.sha256 on the CDN); pushes to main and "force" always
# publish.

name: Publish dev and beta

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [android-release]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing changed
        type: boolean
        default: false

env:
  ANDROID_REPO: velo-pilot/android
  CDN_URL: https://cdn.velopilot.be
  KEEP_RELEASES: 3

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        channel: [dev, beta]
    name: publish ${{ matrix.channel }}
    runs-on: ubuntu-latest
    # Debian's fdroidserver is newer than Ubuntu's
    container: docker.io/library/debian:trixie-slim
    environment:
      name: dev
      url: https://cdn.velopilot.be/fdroid-${{ matrix.channel }}/repo/index.html
    concurrency:
      group: fdroid-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - name: Install fdroidserver
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl fdroidserver > /dev/null
          fdroid --version

      - uses: actions/checkout@v5

      - name: Channel
        run: |
          echo "CHANNEL=${{ matrix.channel }}" >> "$GITHUB_ENV"
          echo "FOLDER=fdroid-${{ matrix.channel }}" >> "$GITHUB_ENV"

      - name: List ${{ matrix.channel }} releases
        env:
          GITHUB_TOKEN: ${{ secrets.ANDROID_RELEASES_TOKEN }}
        run: python3 scripts/fetch-releases.py list build

      - name: Compare with the published repository
        id: inputs
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: |
          hash=$({ find icon*.png metadata scripts -type f -print0 | sort -z | xargs -0 sha256sum; cat build/releases.json; } \
            | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          published=$(curl -fsS "$CDN_URL/$FOLDER/inputs.sha256" 2> /dev/null || true)
          if [ "$(cat build/releases.json)" = "[]" ]; then
            # Keeps whatever the repository holds until the first pre-release
            echo "No $CHANNEL release to publish yet"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$published" = "$hash" ] && [ "$FORCE" != true ]; then
            echo "Nothing changed since the last publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the APKs
        if: steps.inputs.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ANDROID_RELEASES_TOKEN }}
        run: python3 scripts/fetch-releases.py download build

      - name: Build and sign the repository
        if: steps.inputs.outputs.skip != 'true'
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          INPUTS_HASH: ${{ steps.inputs.outputs.hash }}
        run: python3 scripts/build-repo.py build

      - name: Upload to Bunny Storage
        if: steps.inputs.outputs.skip != 'true'
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: python3 scripts/bunny-sync.py "build/publish/$FOLDER" "$FOLDER"
